name: QR Studio redesign verification

# Execution-only workflow for the redesign branch. Remove before merge unless
# explicitly retained. Public-repository CI uses GitHub-hosted runners only.
on:
  push:
    branches:
      - web/qr-studio-redesign-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        if: ${{ hashFiles('playwright.config.js') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser regression suite
        if: ${{ hashFiles('playwright.config.js') != '' }}
        run: npm run test:e2e

      - name: Commit generated package lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock [skip ci]"
          git push
